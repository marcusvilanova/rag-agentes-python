name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # O extra "milvus" instala o Milvus Lite (só Linux/macOS) para o teste de contrato do adaptador.
      - run: uv sync --locked --extra milvus
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -m "not integracao" --cov --cov-report=term-missing --cov-fail-under=80

  integracao:
    name: Integração (MongoDB Atlas Local e Redis)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "/usr/local/bin/runner healthcheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m integracao -v
        env:
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true
          REDIS_URL: redis://localhost:6379/15
